<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تفاصيل الهاتف</title>
<style>
body{font-family:Arial;background:#fafafa;padding:20px}
img{max-width:300px}
</style>
</head>
<body>

<select onchange="changeCountry(this.value)">
  <option value="USD">🇺🇸 USD</option>
  <option value="EUR">🇪🇺 EUR</option>
  <option value="SYP">🇸🇾 SYP</option>
  <option value="EGP">🇪🇬 EGP</option>
</select>

<div id="phone"></div>

<script>
let country="USD";
const rates={USD:1,EUR:0.92,SYP:15000,EGP:48};

const id=new URLSearchParams(location.search).get("id");

fetch("phones.json")
.then(r=>r.json())
.then(d=>{
  const p=d.phones.find(x=>x.id==id);
  render(p);
});

function render(p){
  const price=Math.round(p.price_usd*rates[country]);
  document.getElementById("phone").innerHTML=`
    <h1>${p.name}</h1>
    <img src="${p.image}">
    <h2>💰 السعر: ${price} ${country}</h2>

    <h3>🎨 الألوان</h3>
    <p>${p.colors.join(" - ")}</p>

    <h3>📋 المواصفات</h3>
    <pre>${JSON.stringify(p.specs,null,2)}</pre>
  `;
}

function changeCountry(c){country=c;location.reload();}
</script>

</body>
</html>
