<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الهاتف | Ugarit Future</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05050a;
  color: #f0f0f0;
}
header {
  text-align: center;
  padding: 20px;
  border-bottom: 2px solid #d4af37;
}
header h1 {
  margin: 0;
  color: #d4af37;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.phone-img {
  text-align: center;
}
.phone-img img {
  max-width: 260px;
  background: #fff;
  border-radius: 18px;
}
.section {
  margin-top: 30px;
}
.section h2 {
  color: #d4af37;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}
ul {
  list-style: none;
  padding: 0;
}
li {
  padding: 6px 0;
  border-bottom: 1px solid #222;
}
.back {
  display: block;
  margin: 40px auto;
  text-align: center;
  background: linear-gradient(to right,#d4af37,#c0c0c0);
  color: #000;
  padding: 14px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  width: 220px;
}
</style>
</head>

<body>

<header>
  <h1 id="phoneName"></h1>
</header>

<div class="container">

  <div class="phone-img">
    <img id="phoneImage">
  </div>

  <div id="sections"></div>

  <a href="index.html" class="back">⬅️ العودة</a>
</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("phones.json")
.then(r => r.json())
.then(data => {
  const phone = data.phones.find(p => p.id == id);
  if (!phone) return;

  document.getElementById("phoneName").innerText = phone.name;
  document.getElementById("phoneImage").src = phone.image;

  const sections = document.getElementById("sections");

  function renderSection(title, obj) {
    let html = `<div class="section"><h2>${title}</h2><ul>`;
    for (let k in obj) {
      html += `<li><strong>${k}:</strong> ${obj[k]}</li>`;
    }
    html += "</ul></div>";
    sections.innerHTML += html;
  }

  renderSection("📦 معلومات عامة", phone.general);
  renderSection("📱 الشاشة", phone.display);
  renderSection("⚙️ الأداء والمعالج", phone.performance);
  renderSection("💾 الذاكرة", phone.memory);
  renderSection("📸 الكاميرا", phone.camera.rear);
  renderSection("🔋 البطارية", phone.battery);
  renderSection("📡 الاتصال", phone.connectivity);
  renderSection("🔊 الصوت", phone.audio);
  renderSection("🤖 النظام", phone.software);

  renderSection("⭐ المميزات", phone.pros);
  renderSection("⚠️ العيوب", phone.cons);
});
</script>

</body>
</html>
