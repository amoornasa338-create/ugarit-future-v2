<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الهاتف | Ugarit Future</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #05050a;
  color: #f0f0f0;
}
header {
  padding: 15px;
  text-align: center;
  border-bottom: 2px solid #d4af37;
}
header h1 {
  margin: 0;
  color: #d4af37;
}
.container {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.phone-img {
  text-align: center;
}
.phone-img img {
  max-width: 260px;
  border-radius: 20px;
  background: #fff;
}
.price {
  font-size: 22px;
  color: #c0c0c0;
  text-align: center;
  margin: 10px 0;
}
.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  margin: 8px auto;
}
.game { background: #d4af37; color: #000; }
.normal { background: #444; }
.section {
  margin-top: 30px;
}
.section h2 {
  color: #d4af37;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}
ul {
  list-style: none;
  padding: 0;
}
li {
  padding: 8px 0;
  border-bottom: 1px solid #222;
}
.back {
  display: block;
  margin: 35px auto;
  text-align: center;
  color: #000;
  background: linear-gradient(to right, #d4af37, #c0c0c0);
  padding: 14px;
  border-radius: 25px;
  text-decoration: none;
  width: 220px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1 id="phoneName">تحميل...</h1>
</header>

<div class="container">

  <div class="phone-img">
    <img id="phoneImage" src="">
  </div>

  <div class="price" id="phonePrice"></div>

  <div style="text-align:center">
    <span id="usageBadge" class="badge"></span>
  </div>

  <div class="section">
    <h2>📱 المواصفات</h2>
    <ul id="specs"></ul>
  </div>

  <a href="index.html" class="back">⬅️ العودة للقائمة</a>
</div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("phones.json")
  .then(response => response.json())
  .then(data => {
    const phone = data.phones.find(p => String(p.id) === id);
    if (!phone) {
      document.getElementById("phoneName").innerText = "الهاتف غير موجود";
      return;
    }

    document.getElementById("phoneName").innerText = phone.name;
    document.getElementById("phoneImage").src = phone.image;
    document.getElementById("phonePrice").innerText = "السعر التقريبي: " + phone.price + "$";

    const specsList = document.getElementById("specs");
    specsList.innerHTML = "";

    Object.entries(phone.specs).forEach(([key, value]) => {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${key}:</strong> ${value}`;
      specsList.appendChild(li);
    });
  })
  .catch(err => {
    document.getElementById("phoneName").innerText = "خطأ في تحميل البيانات";
    console.error(err);
  });
</script>

</body>
</html>
