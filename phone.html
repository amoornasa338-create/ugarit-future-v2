<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تفاصيل الهاتف</title>

<style>
body{font-family:Arial;background:#fafafa;padding:20px}
img{max-width:250px}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{border:1px solid #ccc;padding:8px}
th{background:#eee}
</style>
</head>

<body>

<select onchange="manualCountry(this.value)">
  <option value="USD">🇺🇸 USD</option>
  <option value="EUR">🇪🇺 EUR</option>
  <option value="SYP">🇸🇾 SYP</option>
  <option value="EGP">🇪🇬 EGP</option>
</select>

<div id="content"></div>

<script>
let rates={USD:1,EUR:0.92,SYP:15000,EGP:48};
let country="USD";

fetch("https://ipapi.co/json/")
.then(r=>r.json())
.then(d=>{
  if(d.country_code==="SY") country="SYP";
  if(d.country_code==="EG") country="EGP";
  if(d.country_code==="DE") country="EUR";
  load();
})
.catch(load);

function manualCountry(c){country=c;load();}

function load(){
  const params=new URLSearchParams(location.search);
  fetch("phones.json")
  .then(r=>r.json())
  .then(d=>{
    if(params.get("compare")){
      const ids=params.get("compare").split(",");
      renderCompare(d.phones.filter(p=>ids.includes(String(p.id))));
    } else {
      const id=params.get("id");
      renderSingle(d.phones.find(p=>p.id==id));
    }
  });
}

function renderSingle(p){
  const price=Math.round(p.price_usd*rates[country]);
  document.getElementById("content").innerHTML=`
    <h1>${p.name}</h1>
    <img src="${p.image}">
    <h2>💰 السعر: ${price} ${country}</h2>
    <h3>🎨 الألوان</h3>
    <p>${p.colors.join(" - ")}</p>
    ${specTable(p)}
  `;
}

function renderCompare(list){
  document.getElementById("content").innerHTML=`
    <h1>🔀 مقارنة</h1>
    <table>
      <tr>
        <th>الميزة</th>
        ${list.map(p=>`<th>${p.name}</th>`).join("")}
      </tr>
      ${Object.keys(list[0].specs).map(k=>`
        <tr>
          <td>${k}</td>
          ${list.map(p=>`<td>${JSON.stringify(p.specs[k])}</td>`).join("")}
        </tr>
      `).join("")}
    </table>
  `;
}

function specTable(p){
  return `
  <table>
    ${Object.entries(p.specs).map(([k,v])=>`
      <tr><th>${k}</th><td>${typeof v==="object"?JSON.stringify(v):v}</td></tr>
    `).join("")}
  </table>`;
}
</script>

</body>
</html>
