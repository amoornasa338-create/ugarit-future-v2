<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ugarit Future</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px }
.controls { margin-bottom:20px }
.grid {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:20px;
}
.card {
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
}
img { width:100%; max-height:200px; object-fit:contain }
.compare {
  margin-top:10px;
}
</style>
</head>

<body>

<h1>📱 Ugarit Future</h1>

<div class="controls">
  💰 ميزانيتك:
  <input id="priceInput" type="number" placeholder="مثال: 1000">
  <button onclick="filterByPrice()">بحث</button>

  🎤
  <button onclick="voiceSearch()">بحث صوتي</button>

  🔀
  <button onclick="goCompare()">مقارنة</button>
</div>

<div id="phones" class="grid"></div>

<script>
let phonesData = [];
let compareList = [];

fetch("phones.json")
.then(r => r.json())
.then(d => {
  phonesData = d.phones;
  render(phonesData);
});

function render(list){
  document.getElementById("phones").innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.image}">
      <h3>${p.name}</h3>
      <p>$${p.price_usd}</p>
      <a href="phone.html?id=${p.id}">عرض التفاصيل</a>
      <div class="compare">
        <input type="checkbox" onchange="toggleCompare(${p.id})"> مقارنة
      </div>
    </div>
  `).join("");
}

function filterByPrice(){
  const val = document.getElementById("priceInput").value;
  render(phonesData.filter(p => p.price_usd <= val));
}

function voiceSearch(){
  const rec = new webkitSpeechRecognition();
  rec.lang = "ar";
  rec.onresult = e => {
    const q = e.results[0][0].transcript.toLowerCase();
    render(phonesData.filter(p => p.name.toLowerCase().includes(q)));
  };
  rec.start();
}

function toggleCompare(id){
  if(compareList.includes(id))
    compareList = compareList.filter(x=>x!==id);
  else if(compareList.length<2)
    compareList.push(id);
}

function goCompare(){
  if(compareList.length===2)
    location.href=`phone.html?compare=${compareList.join(",")}`;
  else
    alert("اختر هاتفين فقط للمقارنة");
}
</script>

</body>
</html>
